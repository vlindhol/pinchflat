name: Docker Release (fork)

# Builds and publishes ghcr.io/vlindhol/pinchflat images.
#
# Tagging:
#   - push to shirgit   -> ghcr.io/vlindhol/pinchflat:latest (plus a sha-* tag)
#   - workflow_dispatch -> ghcr.io/vlindhol/pinchflat:dev (or custom tag)
#
# The production container uses `AutoUpdate=registry`, so pushing :latest
# is what rolls out new versions to the server.
#
# Branch layout in this fork:
#   shirgit         - default branch = upstream + our patch stack; this is
#                     what gets published and deployed
#   upstream-master - untouched mirror of kieraneglin/pinchflat master;
#                     kept in sync by the sync workflow, we rebase shirgit
#                     onto it (intentionally does NOT trigger this workflow,
#                     so a plain upstream sync never ships unpatched builds)

on:
  push:
    branches:
      - shirgit
  workflow_dispatch:
    inputs:
      platforms:
        type: choice
        description: 'Build Platforms'
        required: true
        default: 'linux/amd64'
        options:
          - 'linux/amd64'
          - 'linux/amd64,linux/arm64'
      docker_tags:
        type: string
        description: 'Docker Tags'
        required: true
        default: 'dev'

jobs:
  build_and_push_docker:
    runs-on: ubuntu-latest
    env:
      dev_arch: 'linux/amd64'
      release_arch: 'linux/amd64,linux/arm64'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            # master pushes roll out automatically: :latest + an immutable sha tag
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}
            type=sha
            # manual runs stay off :latest by default
            type=raw,value=${{ inputs.docker_tags }},enable=${{ github.event_name == 'workflow_dispatch' }}
          flavor: |
            latest=false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/selfhosted.Dockerfile
          platforms: ${{ github.event.inputs.platforms || env.dev_arch }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
